{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingresar Código - HouseCount</title>
    <link rel="stylesheet" href="{% static 'css/StyleRegistro.css' %}">
</head>
<body>
    <div class="login-card" style="max-width: 450px;">
        <h2>Ingresa el Código</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">
            Hemos enviado un código de 6 dígitos a <strong>{{ email }}</strong>.
        </p>

        {% if messages %}
            <ul class="mensajes-alerta">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="POST" class="login-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="codigo">Código de 6 dígitos:</label>
                <input type="text" name="codigo" id="codigo" maxlength="6" pattern="\d{6}" required placeholder="123456" style="text-align: center; font-size: 24px; letter-spacing: 8px; font-weight: bold;">
            </div>
            <button type="submit" class="btn-ingresar" style="margin-top: 15px;">Verificar Código</button>
        </form>

        <div class="login-footer">
            <a href="{% url 'recuperar_clave_correo' %}">Solicitar un nuevo código</a>
        </div>
    </div>
</body>
</html>
