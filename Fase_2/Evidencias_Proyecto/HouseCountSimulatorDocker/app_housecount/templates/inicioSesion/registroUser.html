{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - HomeCount Simulator</title>
    <link rel="stylesheet" href="{% static 'css/StyleLogin.css' %}">
    <link rel="icon" type="image/png" href="{% static 'media/iconosPestana/Login.ico' %}">
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <img src="{% static 'imagen-galeria/logo_pagina.png' %}" alt="Logo HouseCount Simulator" class="logo-img">
        </div>
        <h2>Iniciar Sesión</h2>
        
        {% if messages %}
            <ul class="mensajes-alerta">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="POST" class="login-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-ingresar">Ingresar</button>
        </form>

        <div class="login-footer">
            <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a></p>
            <p style="margin-top: 10px;">
                <a href="{% url 'recuperar_clave_correo' %}">¿Olvidaste tu contraseña?</a>
            </p>
            <p style="margin-top: 10px;">
                <a href="{% url 'inicio' %}">Volver</a>
            </p>
        </div>
    </div>
    <script src="{% static 'js/Background.js' %}"></script>
</body>
</html>
